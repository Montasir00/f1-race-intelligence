[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1_analysis"
version = "0.2.0"
description = "F1 Race Intelligence: driver performance, tyre degradation and pit-stop strategy analytics"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` import the package from src/ without installing it.
pythonpath = ["src"]
testpaths = ["tests"]
